// ─────────────────────────────────────────────────────────────
// 工具：去掉葡语重音，统一比较
// ─────────────────────────────────────────────────────────────
function removeAccents(str) {
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

// ─────────────────────────────────────────────────────────────
// 工具：巴西格式百分比 → 数字
// ─────────────────────────────────────────────────────────────
function normalizePercent(val) {
  if (val === null || val === undefined || val === "-" || val === "") return null;
  if (typeof val === "number") return val < 1 && val > 0 ? val * 100 : val;
  const s = String(val).trim().replace("%", "").replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

// ─────────────────────────────────────────────────────────────
// 工具：巴西格式整数 → 数字（区分千分符和小数点）
// ─────────────────────────────────────────────────────────────
function normalizeNumber(val) {
  if (val === null || val === undefined || val === "-" || val === "") return null;
  if (typeof val === "number") return val;
  let s = String(val).trim();
  if (s.includes(",") && s.includes(".")) {
    s = s.replace(/\./g, "").replace(",", ".");
  } else if (s.includes(",") && !s.includes(".")) {
    s = s.replace(",", ".");
  } else if (s.includes(".") && !s.includes(",")) {
    const parts = s.split(".");
    if (parts.length === 2 && parts[1].length === 3) s = s.replace(".", "");
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

// ─────────────────────────────────────────────────────────────
// 字段识别：去重音后模糊匹配
// ─────────────────────────────────────────────────────────────
function detectColumns(headers) {
  const map = {};
  const log = {};
  const rules = {
    itemId: ["id do item", "item id", "id item"],
    // ★ Status column — used to filter out deleted products
    statusItem: ["status atual do item"],
    produto: ["produto", "product name", "nome do produto", "nome produto"],
    impressoes: ["impressao do produto", "impressoes de produto", "impressao produto", "impressoes produto"],
    cliques: ["cliques por produto", "clicks por produto", "cliques produto"],
    ctr: ["ctr"],
    taxaConversao: ["taxa de conversao de pedido (pedido realizado)", "taxa de conversao de pedidos", "taxa de conversao (pedido realizado)", "taxa de conversao pedido realizado", "taxa conversao pedido realizado"],
    // ⚠️ 不能用 "pedido realizado" 或 "pedidos"——这些词出现在销售额/转化率等列名里
    pedidos: ["pedido feito", "pedidos feitos"],
    variacaoId: ["id da variacao", "id variacao", "variacao id"],
    // ★ SKU da Variação (col 6): e.g. "R-600ml-Nossa Senhora-SB" — used as display title
    skuVariacaoTitle: ["sku da variacao"],
    // SKU Principle (col 7): separate field, not used for title
    skuPrincipal: ["sku principle", "sku principal"]
  };
  headers.forEach((h, i) => {
    if (!h) return;
    const norm = removeAccents(String(h));
    for (const [field, candidates] of Object.entries(rules)) {
      if (map[field] !== undefined) continue;
      if (candidates.some(c => norm.includes(c))) {
        map[field] = i;
        log[field] = {
          colIndex: i,
          originalHeader: h
        };
      }
    }
  });

  // CTR 精确匹配兜底
  if (map.ctr === undefined) {
    const idx = headers.findIndex(h => h && removeAccents(String(h)) === "ctr");
    if (idx !== -1) {
      map.ctr = idx;
      log.ctr = {
        colIndex: idx,
        originalHeader: headers[idx]
      };
    }
  }
  return {
    map,
    log
  };
}

// ─────────────────────────────────────────────────────────────
// 判断是否是变体行（非主商品行）
// ─────────────────────────────────────────────────────────────
function isVariantRow(row, colMap) {
  if (colMap.variacaoId !== undefined) {
    const v = String(row[colMap.variacaoId] || "").trim();
    return v !== "-" && v !== "" && v !== "null" && /^\d{5,}$/.test(v);
  }
  const imp = colMap.impressoes !== undefined ? String(row[colMap.impressoes] || "").trim() : "";
  const cli = colMap.cliques !== undefined ? String(row[colMap.cliques] || "").trim() : "";
  const ctr = colMap.ctr !== undefined ? String(row[colMap.ctr] || "").trim() : "";
  return imp === "-" && cli === "-" && ctr === "-";
}

// ─────────────────────────────────────────────────────────────
// 解析 Excel → TOP30 产品（含第一个 SKU）
// ─────────────────────────────────────────────────────────────
function parseExcelFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {
          type: "array"
        });
        const targetName = wb.SheetNames.find(n => removeAccents(n).includes("melhor desempenho")) || wb.SheetNames.find(n => removeAccents(n).includes("produto")) || wb.SheetNames[0];
        const ws = wb.Sheets[targetName];
        const rows = XLSX.utils.sheet_to_json(ws, {
          header: 1,
          defval: null
        });
        if (rows.length < 2) throw new Error(`Sheet「${targetName}」数据为空`);
        const headers = rows[0].map(h => h ? String(h) : "");
        const {
          map: colMap,
          log: colLog
        } = detectColumns(headers);
        const missing = [];
        if (colMap.produto === undefined) missing.push("商品名称（Produto）");
        if (colMap.pedidos === undefined) missing.push("订单数（Pedido Feito）");
        if (colMap.impressoes === undefined) missing.push("曝光（Impressão do Produto）");
        if (missing.length > 0) {
          throw new Error(`以下必要列未识别到：${missing.join("、")}。\n` + `当前识别到的所有列名：\n${headers.filter(Boolean).join(" | ")}`);
        }

        // 需要过滤掉的商品状态（已删除/下架/审核中）
        const SKIP_STATUSES = new Set(["excluido", "nao listado", "em revisao"]);
        const productMap = new Map(); // itemId → product data
        const firstSkuMap = new Map(); // itemId → first SKU da Variação string

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.every(v => v === null || v === "")) continue;
          const nome = String(row[colMap.produto] || "").trim();
          if (!nome) continue;

          // ★ 过滤已删除商品（Excluído / Não Listado / Em Revisão）
          if (colMap.statusItem !== undefined) {
            const status = removeAccents(String(row[colMap.statusItem] || ""));
            if (SKIP_STATUSES.has(status)) continue;
          }
          const itemId = colMap.itemId !== undefined ? String(row[colMap.itemId] || "").trim() || `row_${i}` : `row_${i}`;

          // ★ 收集变体行的第一个 SKU da Variação（col 6，如 "R-600ml-Nossa Senhora-SB"）
          const isVariant = isVariantRow(row, colMap);
          if (isVariant) {
            if (!firstSkuMap.has(itemId) && colMap.skuVariacaoTitle !== undefined) {
              const sku = String(row[colMap.skuVariacaoTitle] || "").trim();
              if (sku && sku !== "-" && sku !== "null") {
                firstSkuMap.set(itemId, sku);
              }
            }
            continue; // 变体行不作为主产品
          }
          const impressoes = normalizeNumber(colMap.impressoes !== undefined ? row[colMap.impressoes] : null);
          const cliques = normalizeNumber(colMap.cliques !== undefined ? row[colMap.cliques] : null);
          const ctr = normalizePercent(colMap.ctr !== undefined ? row[colMap.ctr] : null);
          const taxa = normalizePercent(colMap.taxaConversao !== undefined ? row[colMap.taxaConversao] : null);
          const pedidos = normalizeNumber(colMap.pedidos !== undefined ? row[colMap.pedidos] : null);
          if (impressoes === null && cliques === null && pedidos === null) continue;
          const hasCore = impressoes !== null && cliques !== null && pedidos !== null;
          const hasFullData = hasCore && ctr !== null && taxa !== null;
          const existing = productMap.get(itemId);
          if (!existing) {
            productMap.set(itemId, {
              itemId,
              nome,
              impressoes,
              cliques,
              ctr,
              taxaConversao: taxa,
              pedidos,
              hasFullData,
              hasCore
            });
          } else if (hasFullData && !existing.hasFullData) {
            productMap.set(itemId, {
              itemId,
              nome,
              impressoes,
              cliques,
              ctr,
              taxaConversao: taxa,
              pedidos,
              hasFullData,
              hasCore
            });
          }
        }

        // 把 firstSku 合并到 product 对象
        for (const [itemId, product] of productMap.entries()) {
          product.firstSku = firstSkuMap.get(itemId) || null;
        }
        let products = Array.from(productMap.values()).filter(p => p.hasFullData);
        if (products.length < 5) {
          products = Array.from(productMap.values()).filter(p => p.hasCore);
        }
        if (products.length === 0) throw new Error("没有找到有效产品数据，请检查 Excel 格式");
        products.sort((a, b) => {
          if ((b.pedidos || 0) !== (a.pedidos || 0)) return (b.pedidos || 0) - (a.pedidos || 0);
          if ((b.taxaConversao || 0) !== (a.taxaConversao || 0)) return (b.taxaConversao || 0) - (a.taxaConversao || 0);
          return (b.cliques || 0) - (a.cliques || 0);
        });

        // 返回全部有效产品（后续在 App 里按不同维度各取 30）
        resolve({
          products,
          sheetName: targetName,
          colMap,
          colLog,
          headers,
          allSheets: wb.SheetNames
        });
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = () => reject(new Error("文件读取失败"));
    reader.readAsArrayBuffer(file);
  });
}

// ─────────────────────────────────────────────────────────────
// 百分位数
// ─────────────────────────────────────────────────────────────
function percentile(arr, p) {
  if (!arr.length) return 0;
  const sorted = [...arr].sort((a, b) => a - b);
  const idx = p / 100 * (sorted.length - 1);
  const lo = Math.floor(idx),
    hi = Math.ceil(idx);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
}
function calculateBenchmarks(products) {
  const get = key => products.map(p => p[key]).filter(v => v !== null && v !== undefined);
  const avg = arr => arr.reduce((s, v) => s + v, 0) / (arr.length || 1);
  const stats = arr => ({
    p25: percentile(arr, 25),
    p50: percentile(arr, 50),
    p75: percentile(arr, 75),
    avg: avg(arr),
    min: arr.length ? Math.min(...arr) : 0,
    max: arr.length ? Math.max(...arr) : 0
  });
  return {
    imp: stats(get("impressoes")),
    cli: stats(get("cliques")),
    ctr: stats(get("ctr").filter(v => v !== null)),
    taxa: stats(get("taxaConversao").filter(v => v !== null)),
    ped: stats(get("pedidos"))
  };
}

// ─────────────────────────────────────────────────────────────
// ★ 诊断核心 — 扩充了所有可能原因
// ─────────────────────────────────────────────────────────────
function diagnoseProduct(p, bm) {
  const {
    impressoes: imp,
    cliques: cli,
    ctr,
    taxaConversao: taxa,
    pedidos: ped
  } = p;

  // ── 数据不足 ──────────────────────────────────────────────
  if (!imp || imp < 200 || !cli || cli < 10) {
    return {
      type: "数据不足观察型",
      color: "gray",
      priority: "P3",
      conclusion: "数据积累不足，暂时无法做出稳定判断。",
      problemLocation: "曝光/点击量太少，CTR 和转化率波动太大，不代表真实水平。",
      quickStrategy: "先积累曝光，等点击量 > 30 后再做诊断。",
      causes: ["产品刚上架，还在获得初始流量", "类目竞争激烈，新品未被算法推荐", "标题关键词未覆盖用户真实搜索词", "未参加任何活动或广告，曝光来源太少", "SKU 数量过少，平台降低展示权重"],
      actions: ["暂时不要大改主图或详情页", "优先做标题关键词研究（用 Shopee 搜索栏的下拉提示找热词）", "可放入活动或做少量广告获得初始流量", "确保产品有至少 3 张图片（Shopee 推荐）", "两周后重新查看数据再做判断"],
      nextMetric: "观察曝光是否提升到 500 以上，点击是否 > 30。",
      recommend: {
        push: false,
        observe: true,
        redoMainImage: false,
        optimizeDetail: false,
        pause: false
      }
    };
  }
  const taxaOk = taxa !== null;
  const highImp = imp >= bm.imp.p75;
  const lowImp = imp <= bm.imp.p25;
  const highCtr = ctr !== null && (ctr >= bm.ctr.p75 || ctr > 4);
  const lowCtr = ctr !== null && (ctr < bm.ctr.p50 || ctr < 2);
  const highTaxa = taxaOk && taxa >= bm.taxa.p75;
  const lowTaxa = taxaOk && (taxa < bm.taxa.p50 || taxa < 1.5);
  const highPed = ped >= bm.ped.p75;
  const lowPed = ped <= bm.ped.p25;

  // ── 1. 爆款放大型 ─────────────────────────────────────────

// 整体总结
// ─────────────────────────────────────────────────────────────
function generateOverallSummary(diagnosed) {
  const counts = {};
  diagnosed.forEach(p => {
    counts[p.diagnosis.type] = (counts[p.diagnosis.type] || 0) + 1;
  });
  const totalPed = diagnosed.reduce((s, p) => s + (p.pedidos || 0), 0);
  const avgCtr = diagnosed.reduce((s, p) => s + (p.ctr || 0), 0) / diagnosed.length;
  const avgTaxa = diagnosed.reduce((s, p) => s + (p.taxaConversao || 0), 0) / diagnosed.length;
  const p1Count = diagnosed.filter(p => p.diagnosis.priority === "P1").length;
  const mainProblem = (counts["高曝光低点击型"] || 0) >= (counts["高点击低转化型"] || 0) ? "主图/标题点击吸引力" : (counts["高点击低转化型"] || 0) >= (counts["低曝光高转化型"] || 0) ? "商品页转化承接" : "流量曝光不足";
  let s = `本月 TOP${diagnosed.length} 整体分析：\n`;
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([type, count]) => {
    s += `  · ${type}：${count} 个\n`;
  });
  s += `\n整体来看，当前最大问题更偏向于【${mainProblem}】。`;
  s += `\nTOP${diagnosed.length} 合计订单 ${totalPed} 单，平均 CTR ${avgCtr.toFixed(2)}%，平均转化率 ${avgTaxa.toFixed(2)}%。`;
  s += `\n本月有 ${p1Count} 个 P1 产品需要马上处理，下个月应集中优先解决这些，不要平均优化所有产品。`;
  return s;
}

// ChatGPT 复盘文本
// ─────────────────────────────────────────────────────────────
function generateChatGPTReviewText(diagnosed) {
  const groups = {};
  diagnosed.forEach(p => {
    const t = p.diagnosis.type;
    if (!groups[t]) groups[t] = [];
    // ★ 优先显示 SKU，否则用商品名前 40 字
    const label = p.firstSku || p.nome.substring(0, 40) + (p.nome.length > 40 ? "..." : "");
    groups[t].push(label);
  });
  let text = `这是店铺近 30 天 TOP${diagnosed.length} 产品数据诊断结果。请基于以下产品分类，帮我制定下个月的主图、详情页、标题和推广优化顺序：\n\n`;
  Object.entries(groups).forEach(([type, names]) => {
    text += `【${type}】\n${names.map(n => "  - " + n).join("\n")}\n\n`;
  });
  text += `请只基于 Impressões de Produto、Cliques Por Produto、CTR、Taxa de Conversão de Pedidos、Pedidos 分析，不要使用其他指标。`;
  return text;
}
